name: APK identity measurements

on:
  push:
    branches: [prototype/test-apk-identity]

permissions:
  contents: read

jobs:
  apk-measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: 3.47.3
          flutter-sha256: 988665565cad9091db1baa54bf6d3868bb40e29719592f3c3a164deefd4208e1
          bazelisk-version: v1.29.0
          bazelisk-sha256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992

      - name: Build no_plugins variants and incremental sequence
        working-directory: examples/no_plugins
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/identity-evidence"
          mkdir -p "$out"
          common=(-c fastbuild --@rules_flutter_core//flutter:mode=debug
            --repo_env=ANDROID_HOME="$ANDROID_HOME"
            --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
            --repo_env=FLUTTER_ROOT="$FLUTTER_ROOT"
            --disk_cache= --remote_cache=)
          bazel build "${common[@]}" //android/app:no_plugins //android/app:identity_test_direct \
            --execution_log_compact_file="$out/e7-step1.binpb" 2>&1 | tee "$out/e7-step1.log"
          bazel build "${common[@]}" //android/app:no_plugins //android/app:identity_test_direct //android/app:identity_test_two \
            --execution_log_compact_file="$out/e7-step2.binpb" 2>&1 | tee "$out/e7-step2.log"
          cp lib/main.dart "$RUNNER_TEMP/main.dart.original"
          trap 'cp "$RUNNER_TEMP/main.dart.original" lib/main.dart' EXIT
          printf '\n// Incremental identity experiment input.\n' >> lib/main.dart
          bazel build "${common[@]}" //android/app:no_plugins //android/app:identity_test_direct //android/app:identity_test_two \
            --execution_log_compact_file="$out/e7-step3.binpb" 2>&1 | tee "$out/e7-step3.log"
          cp "$RUNNER_TEMP/main.dart.original" lib/main.dart
          trap - EXIT
          wc -l android/app/BUILD.bazel android/app_probes/BUILD.bazel android/shared_values/BUILD.bazel > "$out/e3-build-lines.txt"
          for probe in //android/app_probes:identity_macro_argument_probe //android/app_probes:derived_cross_package //android/app_probes:derived_through_alias //android/shared_values:shared_test_apk; do
            safe_name="${probe//\//_}"
            safe_name="${safe_name//:/_}"
            if bazel build "${common[@]}" "$probe" > "$out/e3${safe_name}.log" 2>&1; then
              echo "BUILD_SUCCEEDED $probe" >> "$out/e3-results.txt"
            else
              echo "BUILD_FAILED $probe" >> "$out/e3-results.txt"
            fi
          done
          # E1/E2/E4/E5 variants are built and exported from the same CI runner.
          for name in identity_test_direct identity_test_aggregate identity_test_no_values identity_test_application_id_only identity_test_suffix_relative identity_test_suffix_absolute identity_test_flutter_activity; do
            if bazel build "${common[@]}" "//android/app:$name" > "$out/$name.build.log" 2>&1; then
              cp "bazel-bin/android/app/$name.apk" "$out/$name.apk"
              "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2" dump badging "$out/$name.apk" > "$out/$name.badging"
              "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2" dump xmltree "$out/$name.apk" --file AndroidManifest.xml > "$out/$name.xmltree"
              "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages "$out/$name.apk" > "$out/$name.dex-packages"
            else
              echo "BUILD_FAILED $name" >> "$out/variant-failures.txt"
            fi
          done
          for step in 1 2 3; do
            bazel aquery 'deps(//android/app:identity_test_direct)' --output=textproto "${common[@]}" > "$out/e7-step${step}.aquery"
          done

      - name: Build pub_plugins test APK
        working-directory: examples/pub_plugins
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/identity-evidence"
          common=(-c fastbuild --@rules_flutter_core//flutter:mode=debug
            --repo_env=ANDROID_HOME="$ANDROID_HOME"
            --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
            --repo_env=FLUTTER_ROOT="$FLUTTER_ROOT")
          bazel build "${common[@]}" //android/app:pub_plugins //android/app:identity_test \
            --execution_log_compact_file="$out/pub_plugins.binpb" 2>&1 | tee "$out/pub_plugins.log"
          cp bazel-bin/android/app/identity_test.apk "$out/pub_plugins_identity_test.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2" dump badging "$out/pub_plugins_identity_test.apk" > "$out/pub_plugins_identity_test.badging"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2" dump xmltree "$out/pub_plugins_identity_test.apk" --file AndroidManifest.xml > "$out/pub_plugins_identity_test.xmltree"
          sha256sum "$out"/* > "$out/SHA256SUMS"

      - name: Upload measurement artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-identity-measurements
          path: ${{ runner.temp }}/identity-evidence/
          if-no-files-found: warn
