name: APK identity measurements

on:
  push:
    branches: [prototype/test-apk-identity]

permissions:
  contents: read

jobs:
  apk-measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: 3.47.3
          flutter-sha256: 988665565cad9091db1baa54bf6d3868bb40e29719592f3c3a164deefd4208e1
          bazelisk-version: v1.29.0
          bazelisk-sha256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992

      - name: Build candidate APKs
        working-directory: examples/no_plugins
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/identity-evidence"
          bazel build //android/app:no_plugins //android/app:identity_test_direct //android/app:identity_test_aggregate \
            -c fastbuild --@rules_flutter_core//flutter:mode=debug \
            --repo_env=ANDROID_HOME="$ANDROID_HOME" \
            --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
            --repo_env=FLUTTER_ROOT="$FLUTTER_ROOT" \
            --execution_log_compact_file="$RUNNER_TEMP/identity-evidence/actions.binpb" \
            2>&1 | tee "$RUNNER_TEMP/identity-evidence/build.log"
          for name in no_plugins identity_test_direct identity_test_aggregate; do
            cp "bazel-bin/android/app/$name.apk" "$RUNNER_TEMP/identity-evidence/"
            bazel aquery "deps(//android/app:$name)" --output=textproto \
              > "$RUNNER_TEMP/identity-evidence/$name.aquery"
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2" dump badging "$RUNNER_TEMP/identity-evidence/$name.apk" \
              > "$RUNNER_TEMP/identity-evidence/$name.badging"
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2" dump xmltree "$RUNNER_TEMP/identity-evidence/$name.apk" --file AndroidManifest.xml \
              > "$RUNNER_TEMP/identity-evidence/$name.xmltree"
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages "$RUNNER_TEMP/identity-evidence/$name.apk" \
              > "$RUNNER_TEMP/identity-evidence/$name.dex-packages"
          done
          sha256sum "$RUNNER_TEMP/identity-evidence"/* > "$RUNNER_TEMP/identity-evidence/SHA256SUMS"

      - name: Upload measurement artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-identity-measurements
          path: ${{ runner.temp }}/identity-evidence/
          if-no-files-found: warn
