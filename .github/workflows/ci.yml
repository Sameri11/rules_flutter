name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the SDK used to record the example APK hashes.
  FLUTTER_VERSION: 3.47.3
  # Verify each downloaded SDK archive before unpacking it.
  FLUTTER_SHA256_DARWIN_ARM64: 66144a7cd691059c8c73bfce24178fb9ea2c95d798db8d56d1e2411e760f6583
  FLUTTER_SHA256_LINUX_X64: 988665565cad9091db1baa54bf6d3868bb40e29719592f3c3a164deefd4208e1
  BAZELISK_VERSION: v1.29.0
  # Bazelisk release assets are mutable; verify their bytes before execution.
  BAZELISK_SHA256_LINUX_AMD64: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
  BAZELISK_SHA256_DARWIN_ARM64: cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409
  BAZEL_CACHE_MODE: ${{ github.event_name == 'pull_request' && 'write' || '' }}

jobs:
  lint:
    name: Starlark format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bazelisk
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/$BAZELISK_VERSION/bazelisk-linux-amd64"
          echo "$BAZELISK_SHA256_LINUX_AMD64  $RUNNER_TEMP/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: buildifier (core)
        working-directory: rules_flutter_core
        run: env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel test //:buildifier_test

      - name: buildifier (android)
        working-directory: rules_flutter_android
        run: env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel test //:buildifier_test

      - name: buildifier (examples, tests, tools/ci)
        working-directory: rules_flutter_core
        run: |
          set -euo pipefail
          root="$(cd .. && pwd)"
          files=$(find "$root/examples" "$root/tests" "$root/tools/ci" \
            \( -name BUILD -o -name '*.bazel' -o -name '*.bzl' -o -name '*.star' -o -name '*.sky' -o -name '*.BUILD' -o -name 'WORKSPACE*' \) \
            -not -path '*/bazel-*' -not -path '*/.gradle/*' -not -path '*/build/*' \
            -not -path '*/.git/*' -not -path '*/third_party/*')
          env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel run @buildifier_prebuilt//:buildifier -- -mode=check -lint=warn $files

      - name: Key portability contract (core)
        working-directory: rules_flutter_core
        run: env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel test //tools/ci:key_portability_test

      - name: Key portability contract (android)
        working-directory: rules_flutter_android
        run: env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel test //tools/ci:key_portability_test

      - name: Python selftests
        run: |
          set -euo pipefail
          python3 tools/ci/example_hashes.py --selftest
          python3 tools/ci/cache_stats.py --selftest
          python3 tools/ci/committed_lock_guard.py --selftest
          python3 tools/ci/matrix_gate.py --selftest

      - name: Committed lock portability guard
        run: |
          set -euo pipefail
          python3 tools/ci/committed_lock_guard.py

  core:
    name: Core module and consumers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-sha256: ${{ env.FLUTTER_SHA256_LINUX_X64 }}
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-sha256: ${{ env.BAZELISK_SHA256_LINUX_AMD64 }}
          cache-mode: ${{ env.BAZEL_CACHE_MODE }}
          cache-host: ${{ secrets.BAZEL_CACHE_HOST }}
          cache-project-id: ${{ secrets.BAZEL_CACHE_PROJECT_ID }}
          cache-token: ${{ secrets.BAZEL_CACHE_TOKEN_RW }}

      - name: bazel test //...
        working-directory: rules_flutter_core
        run: |
          set -o pipefail
          env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel test //... 2>&1 | tee ../bazel_test_core.log

      # An SDK change that moves a conformance case outcome fails here.
      - name: Conformance oracles recapture
        working-directory: rules_flutter_core
        run: python3 tests/flutter_test_conformance/rebaseline.py --check

      # The core output base is not read by later steps; release it before the consumer builds.
      - name: Release core output base
        working-directory: rules_flutter_core
        run: bazel clean --expunge

      - name: Dynamic namespace rejection
        working-directory: tests/namespace_dynamic
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/dynamic_namespace.log"
          if bazel build //:dynamic_namespace_failure 2>&1 | tee "$output"; then
            echo "dynamic namespace build unexpectedly succeeded" >&2
            exit 1
          fi
          for expected in \
            "Unsupported namespace expression" \
            "android/build.gradle" \
            '"com.example." + project.name'; do
            if ! grep -Fq "$expected" "$output"; then
              echo "dynamic namespace output lacked: $expected" >&2
              exit 1
            fi
          done
      - name: BuildConfig validation rejection
        working-directory: tests/consumer
        run: python3 build_config_probe.py
      - name: Core Consumer isolation
        working-directory: tests/core_consumer
        run: |
          set -euo pipefail
          core_output_base="$(mktemp -d)"
          trap 'chmod -R u+w "$core_output_base" 2>/dev/null; rm -rf "$core_output_base"' EXIT
          env -u ANDROID_HOME -u ANDROID_NDK_HOME \
            python3 ../../tools/ci/android_toolchain_probe.py \
            --scenario core-isolation --output-base "$core_output_base"

      - name: Consumer missing-NDK scenario
        working-directory: tests/consumer
        run: |
          set -euo pipefail
          missing_output_base="$(mktemp -d)"
          trap 'chmod -R u+w "$missing_output_base" 2>/dev/null; rm -rf "$missing_output_base"' EXIT
          python3 ../../tools/ci/android_toolchain_probe.py \
            --scenario missing-ndk --output-base "$missing_output_base"

      - name: Consumer API test
        working-directory: tests/consumer
        run: |
          set -o pipefail
          bazel build --nobuild --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" //... 2>&1 | tee ../../bazel_consumer_api.log

      - name: Consumer Android toolchain inventory
        working-directory: tests/consumer
        run: python3 ../../tools/ci/android_toolchain_probe.py --scenario inventory

      - name: Consumer NDK compile probe
        working-directory: tests/consumer
        run: python3 ../../tools/ci/android_toolchain_probe.py --scenario compile-probe

      - name: Lock portability gate
        run: |
          python3 tools/ci/android_toolchain_probe.py --scenario lock-portability

      - name: Consumer behaviour checks
        working-directory: tests/consumer
        run: |
          set -o pipefail
          bazel test --build_tests_only --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" //... 2>&1 | tee ../../bazel_consumer_test.log

      # Composed app: the APK check fails the build on a planted mismatch.
      - name: Consumer composed app release APK check
        working-directory: tests/consumer
        run: |
          set -o pipefail
          bazel build -c opt --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" --android_platforms=@rules_android//:arm64-v8a //composed_app:apk_check_test //composed_app:apk_variant_check_test 2>&1 | tee ../../bazel_composed_release.log

      - name: Consumer composed app debug APK check
        working-directory: tests/consumer
        run: |
          set -o pipefail
          bazel build --@rules_flutter_core//flutter:mode=debug -c fastbuild --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" --android_platforms=@rules_android//:arm64-v8a //composed_app:apk_check_test //composed_app:apk_variant_check_test 2>&1 | tee ../../bazel_composed_debug.log

      # The 3-ABI union shares its kernel, asset bundle, ELF, engine strip and
      # CMake build actions between both APKs.
      - name: Consumer composed app 3-ABI graph guard
        working-directory: tests/consumer
        run: |
          set -euo pipefail
          bazel aquery -c opt 'mnemonic("DartAotKernel|FlutterAssetBundle|DartAotElf|FlutterEngineStrip|CcCmakeMakeRule", deps(//composed_app:apk) + deps(//composed_app:apk_variant))' \
            --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
            --android_platforms=@rules_android//:arm64-v8a,@rules_android//:x86_64,@rules_android//:armeabi-v7a \
            --output=jsonproto > "$RUNNER_TEMP/composed_aquery.json"
          python3 - "$RUNNER_TEMP/composed_aquery.json" <<'PY'
          import collections, json, sys

          with open(sys.argv[1]) as f:
              actions = json.load(f).get("actions", [])
          if not actions:
              sys.exit("composed app aquery returned no actions")
          counts = collections.Counter(a.get("mnemonic") for a in actions)
          expected = {"DartAotKernel": 1, "FlutterAssetBundle": 1, "DartAotElf": 3, "FlutterEngineStrip": 3, "CcCmakeMakeRule": 3}
          for mnemonic, want in expected.items():
              if counts[mnemonic] != want:
                  sys.exit(f"{mnemonic}: expected {want}, got {counts[mnemonic]}")
          PY

      - name: Report cache statistics
        if: always()
        run: python3 tools/ci/cache_stats.py bazel_test_core.log bazel_consumer_api.log bazel_consumer_test.log

  android:
    name: Android module and registrant parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-sha256: ${{ env.FLUTTER_SHA256_LINUX_X64 }}
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-sha256: ${{ env.BAZELISK_SHA256_LINUX_AMD64 }}
          cache-mode: ${{ env.BAZEL_CACHE_MODE }}
          cache-host: ${{ secrets.BAZEL_CACHE_HOST }}
          cache-project-id: ${{ secrets.BAZEL_CACHE_PROJECT_ID }}
          cache-token: ${{ secrets.BAZEL_CACHE_TOKEN_RW }}

      - name: bazel test //...
        working-directory: rules_flutter_android
        run: |
          set -o pipefail
          env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel test //... 2>&1 | tee ../bazel_test_android.log

      # The registrant parity goldens, recaptured from this Flutter SDK, must
      # still match: a template change in flutter_tools fails here.
      - name: Registrant parity recapture
        working-directory: rules_flutter_android
        run: python3 tests/registrant_parity/capture.py --check

      - name: Report cache statistics
        if: always()
        run: python3 tools/ci/cache_stats.py bazel_test_android.log

  example:
    name: Example — ${{ matrix.os }} — ${{ matrix.example.description }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Report every independent example failure.
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-latest
        example:
          - name: demo_app
            directory: examples/demo_app
            description: demo app (3 ABIs, recipes, CMake, path deps)
          # Same module in debug mode: gates the debug kernel/APK bytes.
          - name: demo_app_debug
            directory: examples/demo_app
            description: demo app, debug mode
            mode: debug
          - name: no_plugins
            directory: examples/no_plugins
            description: no plugins at all
          - name: pub_plugins
            directory: examples/pub_plugins
            description: pub plugins with a native half
          - name: local_plugin
            directory: examples/local_plugin
            description: monorepo layout with a local path plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-sha256: ${{ matrix.os == 'macos-15' && env.FLUTTER_SHA256_DARWIN_ARM64 || env.FLUTTER_SHA256_LINUX_X64 }}
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-sha256: ${{ matrix.os == 'macos-15' && env.BAZELISK_SHA256_DARWIN_ARM64 || env.BAZELISK_SHA256_LINUX_AMD64 }}
          # Both demo_app modes share the module's remote cache.
          cache-mode: ${{ matrix.example.directory == 'examples/demo_app' && env.BAZEL_CACHE_MODE || '' }}
          cache-host: ${{ matrix.example.directory == 'examples/demo_app' && secrets.BAZEL_CACHE_HOST || '' }}
          cache-project-id: ${{ matrix.example.directory == 'examples/demo_app' && secrets.BAZEL_CACHE_PROJECT_ID || '' }}
          cache-token: ${{ matrix.example.directory == 'examples/demo_app' && secrets.BAZEL_CACHE_TOKEN_RW || '' }}

      # Runs before the example's first build: cached outputs have no worker spawns to check.
      - name: Test kernel invariants
        working-directory: ${{ matrix.example.directory }}
        run: |
          ../../tools/ci/test_kernel_invariants.sh ${{ matrix.example.mode && format('--@rules_flutter_core//flutter:mode={0}', matrix.example.mode) || '' }}

      # Hash gate builds the APKs below; tests run their target guards.
      - name: bazel test //...
        working-directory: ${{ matrix.example.directory }}
        run: |
          set -o pipefail
          bazel test //... --lockfile_mode=error ${{ matrix.example.mode && format('--@rules_flutter_core//flutter:mode={0}', matrix.example.mode) || '' }} 2>&1 | tee ../../bazel_example_test_${{ matrix.example.name }}.log

      # Host tests must not reach the Android SDK or NDK through any action input or environment.
      - name: Host test closure has no Android SDK or NDK
        if: matrix.os == 'ubuntu-latest' && matrix.example.name == 'demo_app'
        working-directory: ${{ matrix.example.directory }}
        run: |
          set -euo pipefail
          bazel aquery 'deps(kind(".*_test rule", //...) except //android/...)' \
            --output=jsonproto --lockfile_mode=error > "$RUNNER_TEMP/host_test_aquery.json"
          python3 ../../tools/ci/host_test_closure.py "$RUNNER_TEMP/host_test_aquery.json"

      # The update target is manual, so bazel test never builds it. Building it
      # keeps its launcher compiling without writing goldens.
      - name: bazel build golden update target
        if: matrix.example.directory == 'examples/demo_app'
        working-directory: ${{ matrix.example.directory }}
        run: |
          set -o pipefail
          bazel build //:test/golden_test_update_goldens --lockfile_mode=error ${{ matrix.example.mode && format('--@rules_flutter_core//flutter:mode={0}', matrix.example.mode) || '' }} 2>&1 | tee ../../bazel_example_golden_${{ matrix.example.name }}.log

      # Query declared targets first so stale or omitted configured labels fail.
      # Raw APK and canonical entry hashes distinguish content from ZIP-layout
      # changes. gen_snapshot, the NDK's per-host clang, and the gzip encoder
      # are not byte-reproducible across host platforms, so each OS gates
      # against its own recorded table.
      - name: APK hash gate
        run: |
          set -o pipefail
          python3 tools/ci/example_hashes.py --check --only ${{ matrix.example.name }} \
            --golden tools/ci/example_hashes_${{ matrix.os == 'ubuntu-latest' && 'linux' || 'macos' }}.txt \
            2>&1 | tee bazel_example_hash_${{ matrix.example.name }}.log

      # Upload after failures so changed bundle entries and bytes remain
      # diagnosable; raw APKs enable byte-for-byte cross-OS comparison.
      - name: Upload APK entries and binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-apk-artifacts-${{ matrix.os }}-${{ matrix.example.name }}
          path: _ci_hashes/
          if-no-files-found: warn

      # Per OS and example. The gate compares the digests across OS: kernels are
      # byte-identical across hosts, and only driver.dill differs by host.
      - name: Upload kernel digests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-digests-${{ matrix.os }}-${{ matrix.example.name }}
          path: ${{ matrix.example.directory }}/kernel-digests-*.txt
          if-no-files-found: warn

      - name: Report cache statistics
        if: always()
        run: |
          python3 tools/ci/cache_stats.py \
            bazel_example_test_${{ matrix.example.name }}.log \
            bazel_example_hash_${{ matrix.example.name }}.log

  # Focused conformance lane also checks helper-edit invalidation with caches disabled.
  conformance:
    name: Test driver conformance — ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-sha256: ${{ env.FLUTTER_SHA256_LINUX_X64 }}
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-sha256: ${{ env.BAZELISK_SHA256_LINUX_AMD64 }}
          cache-mode: ${{ env.BAZEL_CACHE_MODE }}
          cache-host: ${{ secrets.BAZEL_CACHE_HOST }}
          cache-project-id: ${{ secrets.BAZEL_CACHE_PROJECT_ID }}
          cache-token: ${{ secrets.BAZEL_CACHE_TOKEN_RW }}

      - name: bazel test //tests/flutter_test_conformance/... and the test-kernel driver
        working-directory: rules_flutter_core
        run: |
          set -o pipefail
          env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel test //tests/flutter_test_conformance/... //flutter/private/test_kernel_driver/... //tests/test_kernel_driver/... 2>&1 | tee ../bazel_test_conformance.log

      # A helper edit re-runs only the tests that read it, on the worker path.
      - name: Test suite helper edit re-runs importers only
        run: bash tools/ci/test_suite_helper_edit.sh

  gate:
    name: Hash table fully claimed
    # Ensure every recorded example is assigned to a matrix job.
    runs-on: ubuntu-latest
    needs: example
    # Run coverage after matrix failures, then propagate their result below.
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every recorded row belongs to a matrix job
        run: python3 tools/ci/matrix_gate.py rows

      - name: Download kernel digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kernel-digests-*
          path: kernel-digests
          merge-multiple: false

      - name: Kernel digests agree across OS
        run: python3 tools/ci/matrix_gate.py kernel-digests kernel-digests

      - name: Matrix result
        if: needs.example.result != 'success'
        run: |
          echo "example matrix concluded ${{ needs.example.result }}"
          exit 1
