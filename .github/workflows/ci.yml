name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the SDK used to record the example APK hashes.
  FLUTTER_VERSION: 3.44.2
  # Verify each downloaded SDK archive before unpacking it.
  FLUTTER_SHA256_DARWIN_ARM64: 57fbfdc7032678ab30ad577872bbfc4114a25d3cba94fbfa14a050ec61381a23
  FLUTTER_SHA256_LINUX_X64: b0de1d19754688ec6769c9a067db3b0594479d3d767f971bfecfc132904c8d5e
  BAZELISK_VERSION: v1.29.0
  # Bazelisk release assets are mutable; verify their bytes before execution.
  BAZELISK_SHA256_LINUX_AMD64: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
  BAZELISK_SHA256_DARWIN_ARM64: cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409
  BAZEL_CACHE_MODE: ${{ github.event_name == 'pull_request' && 'write' || '' }}

jobs:
  lint:
    name: Starlark format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bazelisk
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/$BAZELISK_VERSION/bazelisk-linux-amd64"
          echo "$BAZELISK_SHA256_LINUX_AMD64  $RUNNER_TEMP/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Test failure, not formatting output, is the CI contract.
      - name: buildifier
        run: bazel test //tools/format:buildifier_test

      - name: Key portability contract
        run: bazel test //tools/ci:key_portability_test

  core:
    name: Root and consumer
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-sha256: ${{ env.FLUTTER_SHA256_DARWIN_ARM64 }}
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-sha256: ${{ env.BAZELISK_SHA256_DARWIN_ARM64 }}
          pub-get: ''

      - name: bazel test //...
        run: |
          set -o pipefail
          bazel test //... 2>&1 | tee bazel_test_root.log

      - name: Consumer API test
        working-directory: tests/consumer
        run: |
          set -o pipefail
          bazel build --nobuild --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" //... 2>&1 | tee ../../bazel_consumer_api.log

      - name: Consumer behaviour checks
        working-directory: tests/consumer
        run: |
          set -o pipefail
          bazel test --build_tests_only --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" //... 2>&1 | tee ../../bazel_consumer_test.log

      - name: Report cache statistics
        if: always()
        run: python3 tools/ci/cache_stats.py bazel_test_root.log bazel_consumer_api.log bazel_consumer_test.log

  example:
    name: Example — ${{ matrix.os }} — ${{ matrix.example.description }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Report every independent example failure.
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-latest
        example:
          - name: demo_app
            directory: examples/demo_app
            description: demo app (3 ABIs, recipes, CMake, path deps)
          - name: no_plugins
            directory: examples/no_plugins
            description: no plugins at all
          - name: pub_plugins
            directory: examples/pub_plugins
            description: pub plugins with a native half
          - name: local_plugin
            directory: examples/local_plugin
            description: monorepo layout with a local path plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-sha256: ${{ matrix.os == 'macos-15' && env.FLUTTER_SHA256_DARWIN_ARM64 || env.FLUTTER_SHA256_LINUX_X64 }}
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-sha256: ${{ matrix.os == 'macos-15' && env.BAZELISK_SHA256_DARWIN_ARM64 || env.BAZELISK_SHA256_LINUX_AMD64 }}
          # Only this example's app module; local_plugin's lives in a subdirectory.
          pub-get: ${{ matrix.example.name == 'local_plugin' && 'examples/local_plugin/packages/host_app' || matrix.example.directory }}
          cache-mode: ${{ matrix.example.name == 'demo_app' && env.BAZEL_CACHE_MODE || '' }}
          cache-host: ${{ matrix.example.name == 'demo_app' && secrets.BAZEL_CACHE_HOST || '' }}
          cache-project-id: ${{ matrix.example.name == 'demo_app' && secrets.BAZEL_CACHE_PROJECT_ID || '' }}
          cache-token: ${{ matrix.example.name == 'demo_app' && secrets.BAZEL_CACHE_TOKEN_RW || '' }}

      # Hash gate builds the APKs below; tests run their target guards.
      - name: bazel test //...
        working-directory: ${{ matrix.example.directory }}
        run: |
          set -o pipefail
          bazel test //... 2>&1 | tee ../../bazel_example_test_${{ matrix.example.name }}.log

      # Query declared targets first so stale or omitted configured labels fail.
      # Raw APK and canonical entry hashes distinguish content from ZIP-layout changes.
      - name: APK hash gate
        run: |
          set -o pipefail
          python3 tools/ci/example_hashes.py --check --only ${{ matrix.example.name }} 2>&1 | tee bazel_example_hash_${{ matrix.example.name }}.log

      # Upload after failures so changed bundle entries and bytes remain
      # diagnosable; raw APKs enable byte-for-byte cross-OS comparison.
      - name: Upload APK entries and binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-apk-artifacts-${{ matrix.os }}-${{ matrix.example.name }}
          path: _ci_hashes/
          if-no-files-found: warn

      - name: Report cache statistics
        if: always()
        run: |
          python3 tools/ci/cache_stats.py \
            bazel_example_test_${{ matrix.example.name }}.log \
            bazel_example_hash_${{ matrix.example.name }}.log

  gate:
    name: Hash table fully claimed
    # Ensure every recorded example is assigned to a matrix job.
    runs-on: ubuntu-latest
    needs: example
    # Run coverage after matrix failures, then propagate their result below.
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every recorded row belongs to a matrix job
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          # Read the matrix instead of duplicating its example list.
          workflow = pathlib.Path(".github/workflows/ci.yml").read_text()
          block = re.search(r"\n        example:\n(.*?)\n    steps:", workflow, re.S)
          if not block:
              sys.exit("FAIL: no example matrix in .github/workflows/ci.yml")
          jobs = set(re.findall(r"^\s+- name: (\S+)$", block.group(1), re.M))
          recorded = {
              line.split(" ", 1)[0]
              for line in pathlib.Path("tools/ci/example_hashes.txt").read_text().splitlines()
              if line and not line.startswith("#")
          }
          missing = sorted(recorded - jobs)
          if missing:
              sys.exit(
                  "FAIL: tools/ci/example_hashes.txt records {} but no matrix job "
                  "builds it, so its bytes are unchecked.".format(missing)
              )
          print("OK: every recorded example has a matrix job: {}".format(sorted(recorded)))
          PY

      - name: Matrix result
        if: needs.example.result != 'success'
        run: |
          echo "example matrix concluded ${{ needs.example.result }}"
          exit 1
