name: CI

# Two jobs, deliberately unequal.
#
# `lint` needs nothing but Bazel -- no Flutter SDK, no Android SDK, no NDK --
# which is only true since //tools/flutter:ndk.bzl stopped making the NDK a
# prerequisite of every target that resolves a toolchain. It is the cheap,
# always-on signal.
#
# `build` needs a precached Flutter SDK, `pub get`, an Android SDK and an NDK,
# because this project has a plugin with a CMake build: generating
# @flutter_plugins resolves the NDK, so even analysis of //... requires one.
# There is no cheap middle ground between the two.
#
# Every module is its own Bazel module -- the root, tests/consumer and each
# example -- so each gets its own invocation. Root //... does not cover them;
# .bazelignore says so explicitly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the SDK these rules were verified against: the engine artifact
  # URLs are derived from its flutter.version.json, and the recorded example
  # APK hashes are its output.
  FLUTTER_VERSION: 3.44.2
  BAZELISK_VERSION: v1.29.0

jobs:
  lint:
    name: Starlark format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bazelisk
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/$BAZELISK_VERSION/bazelisk-linux-amd64"
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # A test rather than `bazel run ...buildifier.check`: it reports through
      # the test protocol, and it fails on real drift rather than merely
      # printing it.
      - name: buildifier
        run: bazel test //tools/format:buildifier_test

  build:
    name: Build, test and hash
    # macOS because that is the only host this has ever been built on, and
    # because `gen_snapshot` is a darwin-x64 binary the rules resolve for any
    # darwin host (tools/flutter/repo.bzl). Moving to ubuntu is the first real
    # test of that host resolution -- worth doing, but its own change.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The rules read an *existing* SDK rather than downloading one, so the
      # engine artifacts have to be present before the first build.
      - name: Precache engine artifacts
        run: flutter precache --android

      # Bazel does not run pub. package_config.json and pubspec.lock are inputs
      # to the kernel and asset actions, and neither exists in a fresh clone.
      # One per app module -- each is its own Flutter project, so each needs its
      # own `pub get`. local_plugin's app is a subdirectory (it is the monorepo
      # shape); the other three are project roots.
      - name: pub get
        run: |
          for d in examples/demo_app examples/no_plugins examples/pub_plugins \
                   examples/local_plugin/packages/host_app; do
            (cd "$d" && flutter pub get)
          done

      - name: Install bazelisk
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/$BAZELISK_VERSION/bazelisk-darwin-arm64"
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Bazel reads $HOME/.bazelrc after each workspace's own, so this is the
      # one place that applies to all six invocations below without editing any
      # checked-in rc. Repository cache only: the engine jars and Maven
      # artifacts are pinned downloads, so caching them is bounded and safe. An
      # action cache is not, and eviction policy is not worth inventing here.
      - name: Bazel CI flags
        run: |
          cat >> "$HOME/.bazelrc" <<'RC'
          common --repository_cache=~/.cache/bazel-repo
          build --verbose_failures
          test --test_output=errors
          RC

      - name: Restore repository cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-macos-15-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/MODULE.bazel', '**/MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-macos-15-${{ env.FLUTTER_VERSION }}-
            bazel-repo-macos-15-

      # NDK 28+ is enforced by //tools/flutter:plugins.bzl -- below that the
      # linker emits 4 KB-aligned segments and the .so segfaults the loader on a
      # 16 KB-page device instead of failing cleanly. The runner image ships
      # 28.2.13676358 beside the 27.x default, so this selects rather than
      # installs.
      - name: Select the NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # Root //... is //sandbox_demo:demo and //tools/format:* -- the examples
      # moved out. It runs the one test the `lint` job already runs, and is kept
      # because it also *builds* every root target.
      #
      # third_party/ is a gitignored clone of the smooth-app test subject, so CI
      # sees fewer targets than a local tree. The modules below are what cover
      # the API a real consumer sees.
      - name: bazel test //...
        run: bazel test //...

      # Engine stripping needs a real NDK. Explicitly forward ANDROID_NDK_HOME
      # so the consumer test does not rely on ambient runner environment.
      - name: Consumer API test
        working-directory: tests/consumer
        run: bazel build --nobuild --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" //...

      - name: Consumer behaviour checks
        working-directory: tests/consumer
        run: bazel test --build_tests_only --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" //...

      # Each example is a separate module, so each needs its own invocation --
      # the same reason tests/consumer does. They are listed rather than globbed
      # so a new example has to be added here deliberately.
      #
      # These run the guards (`:guards_test`, `:<name>_check_test`); the APKs
      # themselves are built by the hash gate below, which is the step that
      # needs them on disk.
      - name: Example — demo app (3 ABIs, recipes, CMake, path deps)
        working-directory: examples/demo_app
        run: bazel test //...

      - name: Example — no plugins at all
        working-directory: examples/no_plugins
        run: bazel test //...

      - name: Example — pub plugins with a native half
        working-directory: examples/pub_plugins
        run: bazel test //...

      - name: Example — monorepo layout with a local path plugin
        working-directory: examples/local_plugin
        run: bazel test //...

      # Builds every APK shape all four examples declare -- seven, counting
      # demo_app's fat APK and its three per-ABI ones -- and compares each
      # against tools/ci/example_hashes.txt. A difference is either a packaging
      # regression or an intended change that has to be recorded in the same
      # commit.
      - name: Example APK hash gate
        run: python3 tools/ci/example_hashes.py --check

      # Uploaded whether the gate passed or not: the per-entry listings are the
      # only way to see *which* file in a bundle moved, and that is needed
      # exactly when the run is red.
      - name: Upload APK entry listings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-apk-entries
          path: _ci_hashes/
          if-no-files-found: warn
