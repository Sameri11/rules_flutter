name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-lockfiles:
        description: Regenerate and upload module lockfiles
        required: false
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the SDK used to record the example APK hashes.
  FLUTTER_VERSION: 3.47.3
  # Verify each downloaded SDK archive before unpacking it.
  FLUTTER_SHA256_DARWIN_ARM64: 66144a7cd691059c8c73bfce24178fb9ea2c95d798db8d56d1e2411e760f6583
  FLUTTER_SHA256_LINUX_X64: 988665565cad9091db1baa54bf6d3868bb40e29719592f3c3a164deefd4208e1
  BAZELISK_VERSION: v1.29.0
  # Bazelisk release assets are mutable; verify their bytes before execution.
  BAZELISK_SHA256_LINUX_AMD64: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
  BAZELISK_SHA256_DARWIN_ARM64: cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409
  BAZEL_CACHE_MODE: ${{ github.event_name == 'pull_request' && 'write' || '' }}
  # Only an explicit bootstrap dispatch may update module locks.
  BAZEL_LOCKFILE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.update-lockfiles && 'update' || 'error' }}

jobs:
  lint:
    name: Starlark format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bazelisk
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/$BAZELISK_VERSION/bazelisk-linux-amd64"
          echo "$BAZELISK_SHA256_LINUX_AMD64  $RUNNER_TEMP/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: buildifier (core)
        working-directory: rules_flutter_core
        run: env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel test //:buildifier_test --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }}

      - name: buildifier (android)
        working-directory: rules_flutter_android
        run: env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel test //:buildifier_test --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }}

      - name: buildifier (examples, tests, tools/ci)
        working-directory: rules_flutter_core
        run: |
          set -euo pipefail
          root="$(cd .. && pwd)"
          files=$(find "$root/examples" "$root/tests" "$root/tools/ci" \
            \( -name BUILD -o -name '*.bazel' -o -name '*.bzl' -o -name '*.star' -o -name '*.sky' -o -name '*.BUILD' -o -name 'WORKSPACE*' \) \
            -not -path '*/bazel-*' -not -path '*/.gradle/*' -not -path '*/build/*' \
            -not -path '*/.git/*' -not -path '*/third_party/*')
          env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel run --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} @buildifier_prebuilt//:buildifier -- -mode=check -lint=warn $files

      - name: Key portability contract (core)
        working-directory: rules_flutter_core
        run: env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel test //tools/ci:key_portability_test --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }}

      - name: Key portability contract (android)
        working-directory: rules_flutter_android
        run: env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel test //tools/ci:key_portability_test --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }}

      - name: Python selftests
        run: |
          set -euo pipefail
          python3 tools/ci/example_hashes.py --selftest
          python3 tools/ci/cache_stats.py --selftest
          python3 tools/ci/committed_lock_guard.py --selftest
          python3 tools/ci/matrix_gate.py --selftest

      - name: Committed lock portability guard
        run: |
          set -euo pipefail
          python3 tools/ci/committed_lock_guard.py

  core:
    name: Core module and consumers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-sha256: ${{ env.FLUTTER_SHA256_LINUX_X64 }}
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-sha256: ${{ env.BAZELISK_SHA256_LINUX_AMD64 }}
          cache-mode: ${{ env.BAZEL_CACHE_MODE }}
          cache-host: ${{ secrets.BAZEL_CACHE_HOST }}
          cache-project-id: ${{ secrets.BAZEL_CACHE_PROJECT_ID }}
          cache-token: ${{ secrets.BAZEL_CACHE_TOKEN_RW }}

      - name: bazel test //...
        working-directory: rules_flutter_core
        run: |
          set -o pipefail
          env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel test //... --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} 2>&1 | tee ../bazel_test_core.log

      # An SDK change that moves a conformance case outcome fails here.
      - name: Conformance oracles recapture
        working-directory: rules_flutter_core
        run: python3 tests/flutter_test_conformance/rebaseline.py --check

      # The core output base is not read by later steps; release it before the consumer builds.
      - name: Release core output base
        working-directory: rules_flutter_core
        run: bazel clean --expunge

      - name: Dynamic namespace rejection
        working-directory: tests/namespace_dynamic
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/dynamic_namespace.log"
          if bazel build --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} //:dynamic_namespace_failure 2>&1 | tee "$output"; then
            echo "dynamic namespace build unexpectedly succeeded" >&2
            exit 1
          fi
          for expected in \
            "Unsupported namespace expression" \
            "android/build.gradle" \
            '"com.example." + project.name'; do
            if ! grep -Fq "$expected" "$output"; then
              echo "dynamic namespace output lacked: $expected" >&2
              exit 1
            fi
          done
      - name: BuildConfig validation rejection
        working-directory: tests/consumer
        run: python3 build_config_probe.py
      - name: Core Consumer isolation
        working-directory: tests/core_consumer
        run: |
          set -euo pipefail
          core_output_base="$(mktemp -d)"
          trap 'chmod -R u+w "$core_output_base" 2>/dev/null; rm -rf "$core_output_base"' EXIT
          env -u ANDROID_HOME -u ANDROID_NDK_HOME \
            python3 ../../tools/ci/android_toolchain_probe.py \
            --scenario core-isolation --output-base "$core_output_base"

      - name: Consumer missing-NDK scenario
        working-directory: tests/consumer
        run: |
          set -euo pipefail
          missing_output_base="$(mktemp -d)"
          trap 'chmod -R u+w "$missing_output_base" 2>/dev/null; rm -rf "$missing_output_base"' EXIT
          python3 ../../tools/ci/android_toolchain_probe.py \
            --scenario missing-ndk --output-base "$missing_output_base"

      - name: Consumer API test
        working-directory: tests/consumer
        run: |
          set -o pipefail
          bazel build --nobuild -c opt --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" --android_platforms=@rules_android//:arm64-v8a //:analysis_only 2>&1 | tee ../../bazel_consumer_analysis_only.log
          bazel build --nobuild --build_tests_only -c opt --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" --android_platforms=@rules_android//:arm64-v8a //... 2>&1 | tee ../../bazel_consumer_api.log

      - name: Consumer pub workspace checks
        working-directory: tests/consumer
        run: |
          set -euo pipefail
          bazel build -c opt --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" --android_platforms=@rules_android//:arm64-v8a //pub_workspace/member:package
          bazel test -c opt --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" --android_platforms=@rules_android//:arm64-v8a //pub_workspace/member:package_test
          bazel build -c opt --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" --android_platforms=@rules_android//:arm64-v8a //pub_workspace/app:core //pub_workspace/app2:core

      - name: Consumer host wildcard analysis
        working-directory: tests/consumer
        run: |
          set -o pipefail
          bazel build --nobuild -c fastbuild --@rules_flutter_core//flutter:mode=debug --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" //... 2>&1 | tee ../../bazel_consumer_host_debug.log
          bazel build --nobuild -c opt --@rules_flutter_core//flutter:mode=release --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" //... 2>&1 | tee ../../bazel_consumer_host_release.log

      - name: Consumer Android toolchain inventory
        working-directory: tests/consumer
        run: python3 ../../tools/ci/android_toolchain_probe.py --scenario inventory

      - name: Consumer NDK compile probe
        working-directory: tests/consumer
        run: python3 ../../tools/ci/android_toolchain_probe.py --scenario compile-probe

      - name: Lock portability gate
        run: |
          python3 tools/ci/android_toolchain_probe.py --scenario lock-portability

      - name: Consumer behaviour checks
        working-directory: tests/consumer
        run: |
          set -o pipefail
          bazel test --build_tests_only -c opt --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" --android_platforms=@rules_android//:arm64-v8a //... 2>&1 | tee ../../bazel_consumer_test.log
          python3 ../../tools/ci/plugin_graph_guard.py --selftest
          python3 ../../tools/ci/plugin_graph_guard.py
          python3 ../../tools/ci/plugin_deps_rejection.py
          python3 ../../tools/ci/core_target_os_rejection.py
          python3 ../../tools/ci/native_hook_env_analysis.py
          python3 ../../tools/ci/maven_identity_check.py
          bazel build -c opt --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" --android_platforms=@rules_android//:arm64-v8a //:consumer_rules_r8
          python3 ../../tools/ci/consumer_rules_check.py

      - name: Plugin hub guard against private loads
        run: python3 tools/ci/plugin_hub_boundary_guard.py --selftest

      - name: Example plugin hub public-load guard
        working-directory: examples/pub_plugins
        run: python3 ../../tools/ci/plugin_hub_boundary_guard.py @flutter_plugins//:generated_plugin_registrant_src

      - name: Consumer plugin hubs public-load guard
        working-directory: tests/consumer
        run: python3 ../../tools/ci/plugin_hub_boundary_guard.py @flutter_plugins//:generated_plugin_registrant_src @composed_plugins//:generated_plugin_registrant_src @composed_override_plugins//:generated_plugin_registrant_src

      - name: Consumer hand-wired app mode and DEX checks
        working-directory: tests/consumer
        run: |
          set -euo pipefail
          apk="bazel-bin/hand_wired_app/hand_wired_app_unsigned.apk"
          bazel build -c fastbuild --@rules_flutter_core//flutter:mode=debug --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" --android_platforms=@rules_android//:arm64-v8a //hand_wired_app:hand_wired_app
          python3 ../../tools/ci/hand_wired_dex_check.py debug "$apk"
          bazel build -c opt --@rules_flutter_core//flutter:mode=release --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" --android_platforms=@rules_android//:arm64-v8a //hand_wired_app:hand_wired_app
          python3 ../../tools/ci/hand_wired_dex_check.py release "$apk"

      - name: Consumer mixed-platform debug and Android asset selection
        working-directory: tests/consumer
        run: |
          set -euo pipefail
          bazel build -c fastbuild --@rules_flutter_core//flutter:mode=debug --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" --android_platforms=@rules_android//:arm64-v8a //mixed_platform:fake_app //mixed_platform:fake_debug_app //mixed_platform:android_app_mixed_debug //mixed_platform:android_app
      # Composed app: the APK check fails the build on a planted mismatch.
      - name: Consumer composed app release APK check
        working-directory: tests/consumer
        run: |
          set -o pipefail
          python3 ../../tools/ci/composed_build.py release "$RUNNER_TEMP" 2>&1 | tee ../../bazel_composed_release.log

      - name: Consumer composed app debug APK check
        working-directory: tests/consumer
        run: |
          set -o pipefail
          python3 ../../tools/ci/composed_build.py debug "$RUNNER_TEMP" 2>&1 | tee ../../bazel_composed_debug.log

      # Capture both modes' action graphs, compare SDK-derived strip inputs and
      # AAR payloads, and require each ABI's missing AAR library to fail.
      - name: Consumer composed app direct-route graph and AAR guard
        run: python3 tools/ci/composed_route_guard.py "$RUNNER_TEMP"

      - name: Upload composed direct-route graphs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composed-direct-route-evidence
          path: |
            ${{ runner.temp }}/composed-*-aquery.json
            ${{ runner.temp }}/direct-*.apk
            ${{ runner.temp }}/composed-*.aar
            ${{ runner.temp }}/aar_missing_native_*.log
          if-no-files-found: warn

      - name: Report cache statistics
        if: always()
        run: python3 tools/ci/cache_stats.py bazel_test_core.log bazel_consumer_api.log bazel_consumer_test.log
      - name: Upload bootstrap module locks
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-locks-core
          path: |
            rules_flutter_core/MODULE.bazel.lock
            tests/consumer/MODULE.bazel.lock
            tests/namespace_dynamic/MODULE.bazel.lock
            tests/core_consumer/MODULE.bazel.lock


  android:
    name: Android module and registrant parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-sha256: ${{ env.FLUTTER_SHA256_LINUX_X64 }}
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-sha256: ${{ env.BAZELISK_SHA256_LINUX_AMD64 }}
          cache-mode: ${{ env.BAZEL_CACHE_MODE }}
          cache-host: ${{ secrets.BAZEL_CACHE_HOST }}
          cache-project-id: ${{ secrets.BAZEL_CACHE_PROJECT_ID }}
          cache-token: ${{ secrets.BAZEL_CACHE_TOKEN_RW }}

      - name: bazel test //...
        working-directory: rules_flutter_android
        run: |
          set -o pipefail
          env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel test //... --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} 2>&1 | tee ../bazel_test_android.log

      - name: Registrant parity tests in debug mode
        working-directory: rules_flutter_android
        run: bazel test --@rules_flutter_core//flutter:mode=debug --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} //tests/registrant_parity:all

      # The registrant parity goldens, recaptured from this Flutter SDK, must
      # still match: a template change in flutter_tools fails here.
      - name: Registrant parity recapture
        working-directory: rules_flutter_android
        run: python3 tests/registrant_parity/capture.py --check

      - name: Report cache statistics
        if: always()
        run: python3 tools/ci/cache_stats.py bazel_test_android.log
      - name: Upload bootstrap module lock
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-locks-android
          path: rules_flutter_android/MODULE.bazel.lock

  example:
    name: Example — ${{ matrix.os }} — ${{ matrix.example.description }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Report every independent example failure.
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-latest
        example:
          - name: demo_app
            directory: examples/demo_app
            description: demo app (3 ABIs, recipes, CMake, path deps)
          # Same module in debug mode: gates the debug kernel/APK bytes.
          - name: demo_app_debug
            directory: examples/demo_app
            description: demo app, debug mode
            mode: debug
          - name: no_plugins
            directory: examples/no_plugins
            description: no plugins at all
          - name: pub_plugins
            directory: examples/pub_plugins
            description: pub plugins with a native half
          - name: local_plugin
            directory: examples/local_plugin
            description: monorepo layout with a local path plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-sha256: ${{ matrix.os == 'macos-15' && env.FLUTTER_SHA256_DARWIN_ARM64 || env.FLUTTER_SHA256_LINUX_X64 }}
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-sha256: ${{ matrix.os == 'macos-15' && env.BAZELISK_SHA256_DARWIN_ARM64 || env.BAZELISK_SHA256_LINUX_AMD64 }}
          # Both demo_app modes share the module's remote cache.
          cache-mode: ${{ matrix.example.directory == 'examples/demo_app' && env.BAZEL_CACHE_MODE || '' }}
          cache-host: ${{ matrix.example.directory == 'examples/demo_app' && secrets.BAZEL_CACHE_HOST || '' }}
          cache-project-id: ${{ matrix.example.directory == 'examples/demo_app' && secrets.BAZEL_CACHE_PROJECT_ID || '' }}
          cache-token: ${{ matrix.example.directory == 'examples/demo_app' && secrets.BAZEL_CACHE_TOKEN_RW || '' }}

      - name: APK inventory rejects an unlisted app
        if: matrix.os == 'ubuntu-latest' && matrix.example.name == 'demo_app'
        run: python3 tools/ci/apk_inventory_probe.py --golden tools/ci/example_hashes_linux.txt

      # Runs before the example's first build: cached outputs have no worker spawns to check.
      - name: Test kernel invariants
        working-directory: ${{ matrix.example.directory }}
        run: |
          ../../tools/ci/test_kernel_invariants.sh ${{ matrix.example.mode == 'debug' && '-c fastbuild --@rules_flutter_core//flutter:mode=debug' || '-c opt' }}

      # Kernel checks need worker spawns; the ABI sequence needs fresh production outputs.
      - name: Reset measured ABI sequence
        if: matrix.os == 'ubuntu-latest' && matrix.example.name == 'demo_app'
        working-directory: ${{ matrix.example.directory }}
        run: bazel clean --expunge

      # Query declared targets first so stale or omitted configured labels fail.
      # Raw APK and canonical entry hashes distinguish content from ZIP-layout
      # changes. gen_snapshot, the NDK's per-host clang, and the gzip encoder
      # are not byte-reproducible across host platforms, so each OS gates
      # against its own recorded table.
      - name: APK hash gate
        run: |
          set -o pipefail
          python3 tools/ci/example_hashes.py --check --only ${{ matrix.example.name }} \
            --golden tools/ci/example_hashes_${{ matrix.os == 'ubuntu-latest' && 'linux' || 'macos' }}.txt \
            2>&1 | tee bazel_example_hash_${{ matrix.example.name }}.log

      - name: Build and check debug test APKs
        if: matrix.example.name == 'no_plugins' || matrix.example.name == 'pub_plugins'
        working-directory: ${{ matrix.example.directory }}
        run: |
          set -euo pipefail
          common=(-c fastbuild --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} --@rules_flutter_core//flutter:mode=debug)
          if [[ "${{ matrix.example.name }}" == no_plugins ]]; then
            tests=(//android/app:no_plugins_smoke //android/app:no_plugins_prebuilt //android/app:no_plugins_suffix //android/app:no_plugins_flutter_activity)
            checks=(//android/app:no_plugins_smoke_check_test //android/app:no_plugins_prebuilt_check_test //android/app:no_plugins_suffix_check_test //android/app:no_plugins_flutter_activity_check_test)
            runners=(//android/app:no_plugins_integration_pass_test //android/app:no_plugins_integration_fail_test //android/app:no_plugins_integration_lifecycle_test //android/app:no_plugins_integration_timeout_test //android/app:no_plugins_integration_crash_test //android/app:no_plugins_integration_deadline_test)
            bazel build "${common[@]}" //android/app:no_plugins "${tests[@]}" "${checks[@]}" "${runners[@]}"
            python3 ../../tools/ci/test_apk_kernel_check.py --bazel-arg=-c --bazel-arg=fastbuild --bazel-arg=--@rules_flutter_core//flutter:mode=debug --app-core //:core --app-apk //android/app:no_plugins \
              --test //android/app:no_plugins_smoke=//android/app:no_plugins_smoke_core \
              --test //android/app:no_plugins_prebuilt=//integration_test:prebuilt_core \
              --test //android/app:no_plugins_suffix=//android/app:no_plugins_suffix_core \
              --test //android/app:no_plugins_flutter_activity=//android/app:no_plugins_flutter_activity_core
          else
            bazel build "${common[@]}" //android/app:pub_plugins //android/app:pub_plugins_smoke //android/app:pub_plugins_smoke_check_test //android/app:pub_plugins_smoke_integration_test
            python3 ../../tools/ci/test_apk_kernel_check.py --bazel-arg=-c --bazel-arg=fastbuild --bazel-arg=--@rules_flutter_core//flutter:mode=debug --app-core //:app --app-apk //android/app:pub_plugins \
              --test //android/app:pub_plugins_smoke=//android/app:pub_plugins_smoke_core
          fi

      # Collect APK execution evidence before test targets populate their outputs.
      - name: bazel test //...
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.example.directory }}
        run: |
          set -o pipefail
          bazel test --build_tests_only //... --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} ${{ matrix.example.mode == 'debug' && '-c fastbuild --@rules_flutter_core//flutter:mode=debug' || '-c opt' }} 2>&1 | tee ../../bazel_example_test_${{ matrix.example.name }}.log

      # Host tests must not reach the Android SDK or NDK through any action input or environment.
      - name: Host test closure has no Android SDK or NDK
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.example.name == 'demo_app' }}
        working-directory: ${{ matrix.example.directory }}
        run: |
          python3 ../../tools/ci/host_test_closure.py \
            --lockfile-mode "${{ env.BAZEL_LOCKFILE_MODE }}" \
            "$RUNNER_TEMP/host_test_aquery.json"

      # The update target is manual, so bazel test never builds it. Building it
      # keeps its launcher compiling without writing goldens.
      - name: bazel build golden update target
        if: ${{ !cancelled() && matrix.example.directory == 'examples/demo_app' }}
        working-directory: ${{ matrix.example.directory }}
        run: |
          set -o pipefail
          bazel build //:test/golden_test_update_goldens --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} ${{ matrix.example.mode == 'debug' && '-c fastbuild --@rules_flutter_core//flutter:mode=debug' || '-c opt' }} 2>&1 | tee ../../bazel_example_golden_${{ matrix.example.name }}.log

      # Upload after failures so changed bundle entries and bytes remain
      # diagnosable; raw APKs enable byte-for-byte cross-OS comparison.
      - name: Upload APK entries and binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-apk-artifacts-${{ matrix.os }}-${{ matrix.example.name }}
          path: _ci_hashes/
          if-no-files-found: warn

      # Per OS and example. The gate compares the digests across OS: kernels are
      # byte-identical across hosts, and only driver.dill differs by host.
      - name: Upload kernel digests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-digests-${{ matrix.os }}-${{ matrix.example.name }}
          path: ${{ matrix.example.directory }}/kernel-digests-*.txt
          if-no-files-found: warn
      - name: Upload bootstrap module lock
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-lock-${{ matrix.example.name }}-${{ matrix.os }}
          path: ${{ matrix.example.directory }}/MODULE.bazel.lock

      - name: Report cache statistics
        if: always()
        run: |
          python3 tools/ci/cache_stats.py \
            bazel_example_test_${{ matrix.example.name }}.log \
            bazel_example_hash_${{ matrix.example.name }}.log

  # Focused conformance lane also checks helper-edit invalidation with caches disabled.
  conformance:
    name: Test driver conformance — ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-sha256: ${{ env.FLUTTER_SHA256_LINUX_X64 }}
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-sha256: ${{ env.BAZELISK_SHA256_LINUX_AMD64 }}
          cache-mode: ${{ env.BAZEL_CACHE_MODE }}
          cache-host: ${{ secrets.BAZEL_CACHE_HOST }}
          cache-project-id: ${{ secrets.BAZEL_CACHE_PROJECT_ID }}
          cache-token: ${{ secrets.BAZEL_CACHE_TOKEN_RW }}

      - name: bazel test //tests/flutter_test_conformance/... and the test-kernel driver
        working-directory: rules_flutter_core
        run: |
          set -o pipefail
          env -u ANDROID_HOME -u ANDROID_NDK_HOME bazel test //tests/flutter_test_conformance/... //flutter/private/test_kernel_driver/... //tests/test_kernel_driver/... --lockfile_mode=${{ env.BAZEL_LOCKFILE_MODE }} 2>&1 | tee ../bazel_test_conformance.log

      # A helper edit re-runs only the tests that read it, on the worker path.
      - name: Test suite helper edit re-runs importers only
        run: bash tools/ci/test_suite_helper_edit.sh

  gate:
    name: Hash table fully claimed
    # Ensure every recorded example is assigned to a matrix job.
    runs-on: ubuntu-latest
    needs: example
    # Run coverage after matrix failures, then propagate their result below.
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every recorded row belongs to a matrix job
        run: python3 tools/ci/matrix_gate.py rows

      - name: Download kernel digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kernel-digests-*
          path: kernel-digests
          merge-multiple: false

      - name: Kernel digests agree across OS
        run: python3 tools/ci/matrix_gate.py kernel-digests kernel-digests

      - name: Matrix result
        if: needs.example.result != 'success'
        run: |
          echo "example matrix concluded ${{ needs.example.result }}"
          exit 1
