name: Test runner share

on:
  push:
    branches: [prototype/grouped-test-targets]

env:
  FLUTTER_VERSION: 3.47.3
  FLUTTER_SHA256_LINUX_X64: 988665565cad9091db1baa54bf6d3868bb40e29719592f3c3a164deefd4208e1

permissions:
  contents: read

jobs:
  measure:
    name: Runner share — ${{ matrix.app }} — ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        app: [serverbox, oinkoin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift
          df -h /

      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-sha256: ${{ env.FLUTTER_SHA256_LINUX_X64 }}
          bazelisk-version: v1.29.0
          bazelisk-sha256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
          cache-mode: ''

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sm" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Fetch and wire app
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          python3 tools/measure/measure.py fetch-apps --app "$APP" --dest "$GITHUB_WORKSPACE/_apps/$APP" --flutter-version "$FLUTTER_VERSION"

      - name: Measure three repeats
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          python3 tools/measure/runner_share.py --app "$APP" --mode per-file --app-dir "$GITHUB_WORKSPACE/_apps/$APP" --out "$RUNNER_TEMP/out/$APP/per-file" --repeats 3
          python3 tools/measure/runner_share.py --app "$APP" --mode directory --app-dir "$GITHUB_WORKSPACE/_apps/$APP" --out "$RUNNER_TEMP/out/$APP/directory" --repeats 3
          python3 tools/measure/runner_share.py --app "$APP" --mode count4 --app-dir "$GITHUB_WORKSPACE/_apps/$APP" --out "$RUNNER_TEMP/out/$APP/count4" --repeats 3
          python3 tools/measure/compare_test_results.py --app "$APP" --out "$RUNNER_TEMP/out/$APP"

      - name: Upload measurement data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-share-${{ matrix.app }}
          path: ${{ runner.temp }}/out/${{ matrix.app }}/**
          if-no-files-found: warn
