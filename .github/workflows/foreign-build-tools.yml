name: Foreign build tools locks

# Diagnostic only: regenerates the affected module locks on the Ubuntu 26.04 runner.
on:
  push:
    branches: [prototype/foreign-build-tools]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.3
  FLUTTER_SHA256_LINUX_X64: 988665565cad9091db1baa54bf6d3868bb40e29719592f3c3a164deefd4208e1
  BAZELISK_VERSION: v1.29.0
  BAZELISK_SHA256_LINUX_AMD64: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992

jobs:
  locks:
    name: Foreign build tools locks — ubuntu-26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-sha256: ${{ env.FLUTTER_SHA256_LINUX_X64 }}
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-sha256: ${{ env.BAZELISK_SHA256_LINUX_AMD64 }}

      # Resource limits for every Bazel command in this job.
      - name: Bazel resource flags
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$HOME/.bazelrc" <<RC
          build --jobs=4
          build --local_resources=cpu=4
          build --worker_max_instances=2
          build --worker_quit_after_build
          RC

      - name: Regenerate locks
        shell: bash
        run: python3 tools/ci/foreign_build_tools_locks.py --out "$RUNNER_TEMP/foreign-build-tools-locks"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: foreign-build-tools-locks
          path: ${{ runner.temp }}/foreign-build-tools-locks
          if-no-files-found: error
