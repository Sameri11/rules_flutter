name: Wildcard platform diagnostic

on:
  push:
    branches: [prototype/wildcard-compatibility]

permissions:
  contents: read

env:
  FLUTTER_SHA256_LINUX_X64: 988665565cad9091db1baa54bf6d3868bb40e29719592f3c3a164deefd4208e1

  BAZELISK_SHA256_LINUX_AMD64: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
jobs:
  baseline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no_plugins
            directory: examples/no_plugins
          - name: pub_plugins
            directory: examples/pub_plugins
          - name: local_plugin
            directory: examples/local_plugin
          - name: demo_app
            directory: examples/demo_app
          - name: consumer
            directory: tests/consumer
          - name: core_consumer
            directory: tests/core_consumer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: 3.47.3
          flutter-sha256: ${{ env.FLUTTER_SHA256_LINUX_X64 }}
          bazelisk-version: v1.29.0
          bazelisk-sha256: ${{ env.BAZELISK_SHA256_LINUX_AMD64 }}
      - name: Baseline build (release default and debug)
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          set +e
          bazel() {
            local subcommand="$1"
            shift
            command bazel "$subcommand" \
              --repo_env=ANDROID_HOME="$ANDROID_HOME" \
              --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
              --repo_env=FLUTTER_ROOT="$FLUTTER_ROOT" "$@"
          }
          mkdir -p "$RUNNER_TEMP/wildcard-logs"
          git worktree add "$RUNNER_TEMP/baseline" origin/main
          baseline="$RUNNER_TEMP/baseline/${{ matrix.directory }}"
          (cd "$baseline" && bazel build --keep_going //...) 2>&1 | tee "$RUNNER_TEMP/wildcard-logs/${{ matrix.name }}-baseline-release.log"
          echo "EXIT_CODE=${PIPESTATUS[0]}" | tee -a "$RUNNER_TEMP/wildcard-logs/${{ matrix.name }}-baseline-release.log"
          (cd "$baseline" && bazel build --keep_going -c fastbuild --@rules_flutter_core//flutter:mode=debug //...) 2>&1 | tee "$RUNNER_TEMP/wildcard-logs/${{ matrix.name }}-baseline-debug.log"
          echo "EXIT_CODE=${PIPESTATUS[0]}" | tee -a "$RUNNER_TEMP/wildcard-logs/${{ matrix.name }}-baseline-debug.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wildcard-baseline-${{ matrix.name }}
          path: ${{ runner.temp }}/wildcard-logs
          if-no-files-found: warn

  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no_plugins
            directory: examples/no_plugins
            core: //:core_libapp_arm64-v8a
          - name: pub_plugins
            directory: examples/pub_plugins
            core: //:app_libapp_arm64-v8a
          - name: demo_app
            directory: examples/demo_app
            core: //:app_libapp_arm64-v8a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: 3.47.3
          flutter-sha256: ${{ env.FLUTTER_SHA256_LINUX_X64 }}
          bazelisk-version: v1.29.0
          bazelisk-sha256: ${{ env.BAZELISK_SHA256_LINUX_AMD64 }}
      - name: Baseline versus A2 matrix
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          set +e
          bazel() {
            local subcommand="$1"
            shift
            command bazel "$subcommand" \
              --repo_env=ANDROID_HOME="$ANDROID_HOME" \
              --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
              --repo_env=FLUTTER_ROOT="$FLUTTER_ROOT" "$@"
          }
          mkdir -p "$RUNNER_TEMP/wildcard-logs"
          git worktree add "$RUNNER_TEMP/baseline" origin/main
          baseline="$RUNNER_TEMP/baseline/${{ matrix.directory }}"
          run_cell() {
            revision="$1"
            name="$2"
            shift 2
            if [[ "$revision" == baseline ]]; then
              (cd "$baseline" && "$@") 2>&1 | tee "$RUNNER_TEMP/wildcard-logs/${{ matrix.name }}-${revision}-${name}.log"
            else
              "$@" 2>&1 | tee "$RUNNER_TEMP/wildcard-logs/${{ matrix.name }}-${revision}-${name}.log"
            fi
            rc=${PIPESTATUS[0]}
            echo "EXIT_CODE=$rc" | tee -a "$RUNNER_TEMP/wildcard-logs/${{ matrix.name }}-${revision}-${name}.log"
          }
          for revision in baseline a2; do
            run_cell "$revision" row3 bazel build --keep_going //...
            run_cell "$revision" row4 bazel test --keep_going //...
            run_cell "$revision" row5 bazel test --build_tests_only --keep_going //...
            run_cell "$revision" row6 bazel build --keep_going --android_platforms=@rules_android//:arm64-v8a //...
            run_cell "$revision" row7 bazel build --keep_going --platforms=@rules_android//:arm64-v8a //...
            run_cell "$revision" row8 bazel build --nobuild "${{ matrix.core }}"
            run_cell "$revision" row9 bazel build --nobuild --platforms=@rules_android//:arm64-v8a "${{ matrix.core }}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wildcard-matrix-${{ matrix.name }}
          path: ${{ runner.temp }}/wildcard-logs
          if-no-files-found: warn
  apk-aquery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no_plugins
            directory: examples/no_plugins
            apk: //android/app:no_plugins
            candidate: a1
            candidate_sha: d03f86e
          - name: demo_app
            directory: examples/demo_app
            apk: //android/app:demo_app
            candidate: a1
            candidate_sha: d03f86e
          - name: no_plugins
            directory: examples/no_plugins
            apk: //android/app:no_plugins
            candidate: a2
            candidate_sha: 14509d7
          - name: demo_app
            directory: examples/demo_app
            apk: //android/app:demo_app
            candidate: a2
            candidate_sha: 14509d7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/flutter-bazel
        with:
          flutter-version: 3.47.3
          flutter-sha256: ${{ env.FLUTTER_SHA256_LINUX_X64 }}
          bazelisk-version: v1.29.0
          bazelisk-sha256: ${{ env.BAZELISK_SHA256_LINUX_AMD64 }}
      - name: Compare release and debug APK action keys
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          set +e
          bazel() {
            local subcommand="$1"
            shift
            command bazel "$subcommand" \
              --repo_env=ANDROID_HOME="$ANDROID_HOME" \
              --repo_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
              --repo_env=FLUTTER_ROOT="$FLUTTER_ROOT" "$@"
          }
          mkdir -p "$RUNNER_TEMP/wildcard-aquery"
          comparison="$RUNNER_TEMP/comparison"
          git worktree add "$comparison" origin/main
          comparison_module="$comparison/${{ matrix.directory }}"
          for mode in release debug; do
            if [[ "$mode" == release ]]; then
              mode_flags=(-c opt --@rules_flutter_core//flutter:mode=release)
            else
              mode_flags=(-c fastbuild --@rules_flutter_core//flutter:mode=debug)
            fi
            (cd "$comparison_module" && bazel aquery "${mode_flags[@]}" --output=jsonproto "deps(${{ matrix.apk }})") >"$RUNNER_TEMP/wildcard-aquery/baseline-${mode}.json" 2>"$RUNNER_TEMP/wildcard-aquery/baseline-${mode}.err"
            rc=$?
            echo "baseline $mode EXIT_CODE=$rc"
            echo "EXIT_CODE=$rc" >>"$RUNNER_TEMP/wildcard-aquery/baseline-${mode}.err"
            jq -r '.actions[].actionKey' "$RUNNER_TEMP/wildcard-aquery/baseline-${mode}.json" | sort >"$RUNNER_TEMP/wildcard-aquery/baseline-${mode}.keys"
            echo "ACTION_KEY_COUNT=$(wc -l <"$RUNNER_TEMP/wildcard-aquery/baseline-${mode}.keys")" >>"$RUNNER_TEMP/wildcard-aquery/baseline-${mode}.err"
          done
          (cd "$comparison_module" && bazel shutdown)
          git worktree remove --force "$comparison"
          git worktree add "$comparison" "${{ matrix.candidate_sha }}"
          comparison_module="$comparison/${{ matrix.directory }}"
          for mode in release debug; do
            if [[ "$mode" == release ]]; then
              mode_flags=(-c opt --@rules_flutter_core//flutter:mode=release)
            else
              mode_flags=(-c fastbuild --@rules_flutter_core//flutter:mode=debug)
            fi
            (cd "$comparison_module" && bazel aquery "${mode_flags[@]}" --output=jsonproto "deps(${{ matrix.apk }})") >"$RUNNER_TEMP/wildcard-aquery/${{ matrix.candidate }}-${mode}.json" 2>"$RUNNER_TEMP/wildcard-aquery/${{ matrix.candidate }}-${mode}.err"
            rc=$?
            echo "${{ matrix.candidate }} $mode EXIT_CODE=$rc"
            echo "EXIT_CODE=$rc" >>"$RUNNER_TEMP/wildcard-aquery/${{ matrix.candidate }}-${mode}.err"
            jq -r '.actions[].actionKey' "$RUNNER_TEMP/wildcard-aquery/${{ matrix.candidate }}-${mode}.json" | sort >"$RUNNER_TEMP/wildcard-aquery/${{ matrix.candidate }}-${mode}.keys"
            echo "ACTION_KEY_COUNT=$(wc -l <"$RUNNER_TEMP/wildcard-aquery/${{ matrix.candidate }}-${mode}.keys")" >>"$RUNNER_TEMP/wildcard-aquery/${{ matrix.candidate }}-${mode}.err"
          done
          for mode in release debug; do
            diff -u "$RUNNER_TEMP/wildcard-aquery/baseline-${mode}.keys" "$RUNNER_TEMP/wildcard-aquery/${{ matrix.candidate }}-${mode}.keys"
            echo "AQUERY_EQUALITY_${mode}=$?"
          done
          (cd "$comparison_module" && bazel shutdown)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wildcard-aquery-${{ matrix.name }}-${{ matrix.candidate }}
          path: ${{ runner.temp }}/wildcard-aquery
          if-no-files-found: warn
