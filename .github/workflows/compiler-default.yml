name: Compiler default probe

on:
  push:
    branches: [prototype/compiler-default]

permissions:
  contents: read

jobs:
  probe:
    name: Compiler default — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe C compiler defaults
        run: >-
          python3 tools/ci/compiler_default_probe.py
          --out "$RUNNER_TEMP/compiler-default"
          --runner-label "${{ matrix.os }}"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-default-${{ matrix.os }}
          path: ${{ runner.temp }}/compiler-default
