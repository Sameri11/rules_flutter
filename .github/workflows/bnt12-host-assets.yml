name: BNT12 prototype host assets

on:
  push:
    branches: [prototype/bnt12-host-assets]

permissions:
  contents: read

jobs:
  linux-no-android-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT
          for name in ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT; do
            echo "$name=" >> "$GITHUB_ENV"
          done
          test ! -e /usr/local/lib/android

      - name: Install Flutter
        shell: bash
        run: |
          set -euo pipefail
          archive="flutter_linux_3.47.3-stable.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$archive"
          echo "988665565cad9091db1baa54bf6d3868bb40e29719592f3c3a164deefd4208e1  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$HOME"
          rm "$RUNNER_TEMP/$archive"
          echo "FLUTTER_ROOT=$HOME/flutter" >> "$GITHUB_ENV"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
          "$HOME/flutter/bin/flutter" precache --android

      - name: Install Bazelisk
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bazel" "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64"
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  $RUNNER_TEMP/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Test A1 and verify dependency closure without Android SDK
        working-directory: examples/no_plugins
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ANDROID_HOME:-}${ANDROID_SDK_ROOT:-}${ANDROID_NDK_HOME:-}${ANDROID_NDK_ROOT:-}"
          test ! -e /usr/local/lib/android
          bazel test //:host_test_tester_assets --disk_cache= --worker_quit_after_build
          bazel query 'deps(//:host_test_tester_assets)' > "$RUNNER_TEMP/a1-query.txt"
          bazel cquery 'deps(//:host_test_tester_assets)' > "$RUNNER_TEMP/a1-cquery.txt"
          if grep -E 'androidsdk|_android_sdk_marker|androidndk' "$RUNNER_TEMP/a1-query.txt" "$RUNNER_TEMP/a1-cquery.txt"; then
            echo "Unexpected Android SDK/NDK edge in A1 host test dependencies" >&2
            exit 1
          fi
