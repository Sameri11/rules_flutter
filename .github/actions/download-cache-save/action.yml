name: Save Bazel downloads
description: Saves the job's download cache after completion, including failed jobs.
inputs:
  cache-hit:
    description: Whether the exact key was restored.
    required: true
  cache-key:
    description: Exact key computed by the restore step.
    required: true
  save:
    description: Whether this job is the designated cache writer.
    required: true
runs:
  using: composite
  steps:
    - name: Report new repository downloads
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        root="$HOME/.cache/bazel-repo/content_addressable/sha256"
        before="$RUNNER_TEMP/bazel-repository-cache-before.txt"
        after="$(mktemp)"
        trap 'rm -f "$after"' EXIT
        find "$root" -type f -name file -print 2>/dev/null | LC_ALL=C sort > "$after"
        added="$(comm -13 "$before" "$after")"
        count=0
        bytes=0
        while IFS= read -r file; do
          [[ -n "$file" ]] || continue
          if [[ "$(uname)" == "Darwin" ]]; then
            size="$(stat -f %z "$file")"
          else
            size="$(stat -c %s "$file")"
          fi
          count=$((count + 1))
          bytes=$((bytes + size))
          if (( size >= 1048576 )); then
            echo "new repository blob >= 1 MiB: $size $file"
          fi
        done <<< "$added"
        echo "new repository blob files: $count"
        echo "new repository blob bytes: $bytes"

    - name: Save Bazel downloads
      if: always() && inputs.save == 'true' && inputs.cache-hit != 'true'
      uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
      continue-on-error: true
      with:
        path: |
          ~/.cache/bazel-repo/content_addressable
          ~/.cache/bazelisk
        key: ${{ inputs.cache-key }}
