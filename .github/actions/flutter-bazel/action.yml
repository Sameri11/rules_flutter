name: Flutter and Bazel environment
description: >
  Installs a checksum-verified Flutter SDK and Bazelisk, prefetches Android
  engine artifacts, and configures Bazel and the NDK.

inputs:
  flutter-version:
    description: Flutter SDK version; engine artifact URLs derive from it.
    required: true
  flutter-sha256:
    description: SHA-256 of the Flutter archive for the current runner platform.
    required: true
  bazelisk-version:
    required: false
    default: v1.29.0
  bazelisk-sha256:
    description: SHA-256 of the Bazelisk binary for the current runner platform.
    required: true
  cache-mode:
    description: >-
      Remote cache mode: `read`, `write`, or empty to disable.
    required: false
    default: ''
  cache-host:
    description: Remote cache host, without a scheme.
    required: false
    default: ''
  cache-project-id:
    description: Remote cache project id, used to build the instance name.
    required: false
    default: ''
  cache-token:
    description: >-
      Cache token whose scope matches `cache-mode`. Any empty cache input
      disables the cache, which is what fork pull requests get.
    required: false
    default: ''
  download-cache-save:
    description: Whether this job is the designated writer for its runner OS.
    required: false
    default: 'false'
  download-cache-lock-hash:
    description: Hash of all module lockfiles, Bazel versions, and Maven install manifests.
    required: true

outputs:
  download-cache-hit:
    description: Whether the exact download-cache entry was restored.
    value: ${{ steps.download-cache.outputs.cache-hit }}
  download-cache-key:
    description: Exact download-cache key to save after the job.
    value: ${{ steps.download-cache.outputs.cache-primary-key }}


runs:
  using: composite
  steps:
    - name: Restore Bazel downloads
      id: download-cache
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
      continue-on-error: true
      with:
        path: |
          ~/.cache/bazel-repo/content_addressable
          ~/.cache/bazelisk
        key: bazel-download-v2-${{ runner.os }}-${{ inputs.download-cache-lock-hash }}-${{ inputs.bazelisk-version }}-${{ inputs.bazelisk-sha256 }}
        restore-keys: |
          bazel-download-v2-${{ runner.os }}-

    - name: Set up Bazel download directories
      shell: bash
      run: |
        mkdir -p "$HOME/.cache/bazel-repo/content_addressable" "$HOME/.cache/bazelisk/bin"
        echo "BAZELISK_HOME=$HOME/.cache/bazelisk" >> "$GITHUB_ENV"
        echo "BAZEL_REPOSITORY_CACHE=$HOME/.cache/bazel-repo" >> "$GITHUB_ENV"
        echo "$HOME/.cache/bazelisk/bin" >> "$GITHUB_PATH"
        cat > "$RUNNER_TEMP/bazel-downloader-block.conf" <<'BLOCK'
        block github.com
        block api.github.com
        block objects.githubusercontent.com
        block release-assets.githubusercontent.com
        block github-releases.githubusercontent.com
        BLOCK
        echo "common --downloader_config=$RUNNER_TEMP/bazel-downloader-block.conf" >> "$HOME/.bazelrc"

    - name: Install bazelisk
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          macOS/ARM64) asset="bazelisk-darwin-arm64" ;;
          Linux/X64) asset="bazelisk-linux-amd64" ;;
          *)
            echo "unsupported Bazelisk runner: $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
            ;;
        esac
        binary="$HOME/.cache/bazelisk/bin/bazel"
        valid=false
        if [[ -f "$binary" ]]; then
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            valid=$(echo "${{ inputs.bazelisk-sha256 }}  $binary" | shasum -a 256 -c - >/dev/null 2>&1 && echo true || echo false)
          else
            valid=$(echo "${{ inputs.bazelisk-sha256 }}  $binary" | sha256sum -c - >/dev/null 2>&1 && echo true || echo false)
          fi
        fi
        if [[ "$valid" != true ]]; then
          rm -f "$binary"
          curl -fsSL -o "$RUNNER_TEMP/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/${{ inputs.bazelisk-version }}/$asset"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "${{ inputs.bazelisk-sha256 }}  $RUNNER_TEMP/bazel" | shasum -a 256 -c -
          else
            echo "${{ inputs.bazelisk-sha256 }}  $RUNNER_TEMP/bazel" | sha256sum -c -
          fi
          install -m 0755 "$RUNNER_TEMP/bazel" "$binary"
          rm "$RUNNER_TEMP/bazel"
        fi
        chmod +x "$binary"

        cat >> "$HOME/.bazelrc" <<RC
        common --repository_cache=$BAZEL_REPOSITORY_CACHE
        common --http_connector_attempts=13
        build --verbose_failures
        test --test_output=errors
        RC
    - name: Install the Flutter SDK
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          macOS/ARM64)
            platform="macos"
            archive="flutter_macos_arm64_${{ inputs.flutter-version }}-stable.zip"
            ;;
          Linux/X64)
            platform="linux"
            archive="flutter_linux_${{ inputs.flutter-version }}-stable.tar.xz"
            ;;
          *)
            echo "unsupported Flutter runner: $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
            ;;
        esac
        curl -fsSL -o "$RUNNER_TEMP/$archive" \
          "https://storage.googleapis.com/flutter_infra_release/releases/stable/$platform/$archive"
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          echo "${{ inputs.flutter-sha256 }}  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$HOME"
        else
          echo "${{ inputs.flutter-sha256 }}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$HOME"
        fi
        rm "$RUNNER_TEMP/$archive"
        echo "FLUTTER_ROOT=$HOME/flutter" >> "$GITHUB_ENV"
        echo "FLUTTER_SUPPRESS_ANALYTICS=true" >> "$GITHUB_ENV"
        echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

    # Rules require a pre-existing SDK with Android engine artifacts.
    - name: Precache engine artifacts
      shell: bash
      run: |
        flutter --version
        flutter precache --android


    - name: Remote cache
      if: >-
        inputs.cache-mode != '' && inputs.cache-token != ''
        && inputs.cache-host != '' && inputs.cache-project-id != ''
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.cache-mode }}
        BAZEL_CACHE_BAZEL_REMOTE_CACHE_HOST: ${{ inputs.cache-host }}
        BAZEL_CACHE_BAZEL_PROJECT_ID: ${{ inputs.cache-project-id }}
        BAZEL_CACHE_BAZEL_REMOTE_CACHE_TOKEN: ${{ inputs.cache-token }}
      run: |
        set -euo pipefail
        case "$CACHE_MODE" in
          read) upload_local_results=false ;;
          write) upload_local_results=true ;;
          *) echo "unknown cache-mode: $CACHE_MODE" >&2; exit 1 ;;
        esac
        cat >> "$HOME/.bazelrc" <<RC
        build --remote_upload_local_results=$upload_local_results
        build --remote_cache=grpcs://${BAZEL_CACHE_BAZEL_REMOTE_CACHE_HOST}
        build --remote_instance_name=${BAZEL_CACHE_BAZEL_PROJECT_ID}
        build --remote_cache_header='Authorization=Bearer ${BAZEL_CACHE_BAZEL_REMOTE_CACHE_TOKEN}'
        RC

    # NDK 28+ avoids 4 KB-aligned .so segments that fail on 16 KB-page devices.
    # Pinned: the NDK changes the native library bytes the example hashes record.
    # Runner images rotate NDKs (ubuntu24 20261004 dropped 28.2), so install it
    # when the image lacks it.
    - name: Select the NDK
      shell: bash
      run: |
        set -euo pipefail
        ndk=28.2.13676358
        if [[ ! -d "$ANDROID_SDK_ROOT/ndk/$ndk/toolchains" ]]; then
          (yes || true) | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
        fi
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ndk" >> "$GITHUB_ENV"
