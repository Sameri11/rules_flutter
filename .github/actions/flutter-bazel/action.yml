name: Flutter and Bazel environment
description: >
  Everything a macOS job needs before it can run bazel against this repo: a
  pinned Flutter SDK with its engine artifacts precached, `pub get` where Bazel
  expects package_config.json, bazelisk, an NDK selection, and a restored
  repository cache. Factored out because four jobs need it identically and a
  drifted copy is worse than a shared one.

  The SDK is installed here rather than by subosito/flutter-action, which cannot
  run in this repository: it calls actions/cache@v5 unpinned, and every action
  in the graph -- nested ones included -- must be pinned to a full-length commit
  SHA. Doing it by hand costs about twenty lines and buys a checksum on the SDK
  bytes, which a repo that gates on artifact hashes should want anyway.

inputs:
  flutter-version:
    description: Flutter SDK to install; the engine artifact URLs derive from it.
    required: true
  flutter-sha256:
    description: >
      sha256 of the macOS arm64 SDK archive, from
      https://storage.googleapis.com/flutter_infra_release/releases/releases_macos.json.
    required: true
  bazelisk-version:
    required: false
    default: v1.29.0
  pub-get:
    description: >
      Space-separated project directories to run `flutter pub get` in. Empty
      skips it -- tests/consumer's fixtures carry checked-in .dart_tool state.
    required: false
    default: >-
      examples/demo_app examples/no_plugins examples/pub_plugins
      examples/local_plugin/packages/host_app

runs:
  using: composite
  steps:
    # Not cached. The unpacked SDK plus its precached artifacts is ~2 GiB, and
    # the repository-wide GitHub cache quota is 10 GiB that the Bazel repository
    # cache already wants half of; a download that takes well under a minute is
    # not worth evicting that for.
    - name: Install the Flutter SDK
      shell: bash
      run: |
        set -euo pipefail
        archive="flutter_macos_arm64_${{ inputs.flutter-version }}-stable.zip"
        curl -fsSL -o "$RUNNER_TEMP/$archive" \
          "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
        echo "${{ inputs.flutter-sha256 }}  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
        unzip -q "$RUNNER_TEMP/$archive" -d "$HOME"
        rm "$RUNNER_TEMP/$archive"
        echo "FLUTTER_ROOT=$HOME/flutter" >> "$GITHUB_ENV"
        echo "FLUTTER_SUPPRESS_ANALYTICS=true" >> "$GITHUB_ENV"
        echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

    # The rules read an *existing* SDK rather than downloading one, so the
    # engine artifacts have to be present before the first build. This is also
    # what builds the flutter_tools snapshot, so it absorbs that cost once.
    - name: Precache engine artifacts
      shell: bash
      run: |
        flutter --version
        flutter precache --android

    # Bazel does not run pub. package_config.json and pubspec.lock are inputs
    # to the kernel and asset actions, and neither exists in a fresh clone.
    - name: pub get
      if: inputs.pub-get != ''
      shell: bash
      run: |
        set -euo pipefail
        for d in ${{ inputs.pub-get }}; do
          (cd "$d" && flutter pub get)
        done

    - name: Install bazelisk
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/bazel" \
          "https://github.com/bazelbuild/bazelisk/releases/download/${{ inputs.bazelisk-version }}/bazelisk-darwin-arm64"
        chmod +x "$RUNNER_TEMP/bazel"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    # Bazel reads $HOME/.bazelrc after each workspace's own, so this is the one
    # place that applies to every invocation without editing a checked-in rc.
    - name: Bazel CI flags
      shell: bash
      run: |
        cat >> "$HOME/.bazelrc" <<'RC'
        common --repository_cache=~/.cache/bazel-repo
        build --verbose_failures
        test --test_output=errors
        RC

    # Restore, never save: four jobs share this key, and a GitHub cache entry is
    # immutable, so parallel saves would be three wasted 2.4 GiB uploads and a
    # warning. One job owns the save.
    - name: Restore repository cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/bazel-repo
        key: bazel-repo-macos-15-${{ inputs.flutter-version }}-${{ hashFiles('**/MODULE.bazel', '**/MODULE.bazel.lock') }}
        restore-keys: |
          bazel-repo-macos-15-${{ inputs.flutter-version }}-
          bazel-repo-macos-15-

    # NDK 28+ is enforced by //tools/flutter:plugins.bzl -- below that the
    # linker emits 4 KB-aligned segments and the .so segfaults the loader on a
    # 16 KB-page device instead of failing cleanly. The runner image ships
    # 28.2.13676358 beside the 27.x default, so this selects rather than
    # installs.
    - name: Select the NDK
      shell: bash
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
