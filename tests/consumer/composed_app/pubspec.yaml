name: composed_app
description: Composition fixture for flutter_core with Android inputs.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  # Path, not hosted: a hosted plugin would make the fixture depend on pub.dev.
  # These local packages exercise Android plugin and native recipe composition.
  composed_plugin:
    path: ../fixtures/composed_plugin
  cmake_plugin:
    path: ../fixtures/cmake_plugin
  recipe_package:
    path: ../fixtures/recipe_package
dev_dependencies:
  dev_cmake_plugin:
    path: ../fixtures/dev_cmake_plugin
flutter:
  assets:
    - assets/composed-marker.txt
