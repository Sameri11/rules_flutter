name: composed_app
description: Composition fixture for flutter_core with Android inputs.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  # Path, not hosted: a hosted plugin would make the fixture depend on pub.dev.
  # The plugin is the Java-carrying fixture the consumer already uses.
  build_config_plugin:
    path: ../fixtures/build_config_plugin
flutter:
  assets:
    - assets/composed-marker.txt
